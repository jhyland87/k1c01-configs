######################################################################
# Filament drying
######################################################################

[gcode_macro TIMED_DRY]
description: Dry filament in the chamber - bed 35C, aux 75%, exhaust 20%, then a fan-only cooldown
variable_running: 0
variable_cooldown_s: 600
gcode:
  {% set hours = params.HOURS|default(1.5)|float %}
  {% set cool = params.COOLDOWN|default(10)|float %}
  {% if hours <= 0 %}
    {action_raise_error("TIMED_DRY: HOURS must be greater than 0")}
  {% endif %}
  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("TIMED_DRY: cannot start while a print is running")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=TIMED_DRY VARIABLE=running VALUE=1
  SET_GCODE_VARIABLE MACRO=TIMED_DRY VARIABLE=cooldown_s VALUE={(cool * 60)|round(0)|int}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=35
  AUX_FAN SPEED=75
  EXHAUST_FAN SPEED=20
  UPDATE_DELAYED_GCODE ID=timed_dry_heat_off DURATION={(hours * 3600)|round(0)|int}
  {action_respond_info("TIMED_DRY: drying for %.2f h, then a %.0f min cooldown. Run TIMED_DRY_CANCEL to stop early." % (hours, cool))}

[delayed_gcode timed_dry_heat_off]
gcode:
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
  UPDATE_DELAYED_GCODE ID=timed_dry_fans_off DURATION={printer["gcode_macro TIMED_DRY"].cooldown_s}
  {action_respond_info("TIMED_DRY: dry time elapsed, bed off, cooling down with fans.")}

[delayed_gcode timed_dry_fans_off]
gcode:
  AUX_FAN SPEED=0
  EXHAUST_FAN SPEED=0
  SET_GCODE_VARIABLE MACRO=TIMED_DRY VARIABLE=running VALUE=0
  {action_respond_info("TIMED_DRY: cycle complete.")}

[gcode_macro TIMED_DRY_CANCEL]
description: Cancel a running TIMED_DRY cycle - bed and both fans off immediately
gcode:
  {% if printer["gcode_macro TIMED_DRY"].running|int == 0 %}
    {action_respond_info("TIMED_DRY: nothing running, shutting off anyway.")}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=timed_dry_heat_off DURATION=0
  UPDATE_DELAYED_GCODE ID=timed_dry_fans_off DURATION=0
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
  AUX_FAN SPEED=0
  EXHAUST_FAN SPEED=0
  SET_GCODE_VARIABLE MACRO=TIMED_DRY VARIABLE=running VALUE=0
  {action_respond_info("TIMED_DRY: cancelled.")}
